<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<!-- Installable app. The manifest needs the login cookie, or a login proxy in front of the server redirects it away. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Çok Lekker">
<!-- The page background shows behind the iPhone status bar; the safe-area padding below keeps content clear of it. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Pick the theme before first paint: a saved choice wins, otherwise follow the device.
  (function(){
    var m = document.cookie.match(/(?:^|; )recipebook-theme=(light|dark)/);
    var dark = m ? m[1] === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<title>Çok Lekker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Delft × İznik: glazed-white page, cobalt ink, İznik red/turquoise/saffron */
    --bg:#f3efe6;
    --bg-2:#e6dfcf;
    --card:#dde5ef;
    --paper:#fffdf8;
    --ink:#1d2b4f;
    --ink-rgb:29,43,79;
    --muted-ink:#55617d;
    --on-bg:#1d2b4f;
    --on-bg-rgb:29,43,79;
    --on-bg-soft:#286570;
    --accent:#2348a0;
    --accent-dark:#1a3778;
    --on-accent:#ffffff;
    --on-accent-rgb:255,255,255;
    --like:#c8402f;
    --like-idle:#b3bccd;
    --danger:#b0372a;
    --cat-dinner:#c8402f;
    --cat-breakfast:#2a9d8f;
    --cat-snack:#e0a030;
    --cat-dessert:#2348a0;
    --cat-inbox:#8a8f9c;
    --badge-formula-bg:rgba(224,160,48,0.2);
    --qty-bg:rgba(224,160,48,0.28);
    --badge-formula-fg:#7a5410;
    --badge-text-bg:rgba(42,157,143,0.16);
    --badge-text-fg:#1d6b62;
    --overlay:rgba(15,22,40,0.55);
    --shadow-rgb:29,43,79;
    --line: rgba(var(--ink-rgb),0.16);
    --shadow: 0 10px 26px rgba(var(--shadow-rgb),0.14);
    --tab-shadow: 0 -3px 10px rgba(var(--shadow-rgb),0.08);
    color-scheme: light;
    --font-d:'Fraunces',serif;
    --font-b:'Karla',sans-serif;
    --font-m:'IBM Plex Mono',monospace;
  }
  /* Kobalt nacht: the same tiles after dark. data-theme is set before first paint (see <head>). */
  :root[data-theme="dark"]{
    --bg:#0f1730;
    --bg-2:#0a1024;
    --card:#17223f;
    --paper:#1e2b4d;
    --ink:#e9eef8;
    --ink-rgb:233,238,248;
    --muted-ink:#9eabc8;
    --on-bg:#e9eef8;
    --on-bg-rgb:233,238,248;
    --on-bg-soft:#6fc3b8;
    --accent:#7fa2f0;
    --accent-dark:#a3bdf6;
    --on-accent:#0a1024;
    --on-accent-rgb:10,16,36;
    --like:#f07462;
    --like-idle:#4a5a80;
    --danger:#f07462;
    --cat-dinner:#f07462;
    --cat-breakfast:#45c4b4;
    --cat-snack:#f0b94a;
    --cat-dessert:#7fa2f0;
    --cat-inbox:#7d879c;
    --badge-formula-bg:rgba(240,185,74,0.16);
    --qty-bg:rgba(240,185,74,0.24);
    --badge-formula-fg:#f3c874;
    --badge-text-bg:rgba(69,196,180,0.16);
    --badge-text-fg:#7fd8cc;
    --overlay:rgba(3,6,15,0.7);
    --shadow-rgb:0,0,0;
    --shadow: 0 10px 26px rgba(var(--shadow-rgb),0.45);
    --tab-shadow: 0 -3px 10px rgba(var(--shadow-rgb),0.3);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(35,72,160,0.10), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(42,157,143,0.10), transparent 60%),
      var(--bg);
    min-height:100vh;
    font-family:var(--font-b);
    color:var(--on-bg);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button, input, select, textarea{ font-family:var(--font-b); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .hidden{ display:none !important; }

  /* env(safe-area-inset-*) is 0 except around an iPhone notch and home indicator (viewport-fit=cover). */
  .wrap{
    max-width:1080px; margin:0 auto;
    padding:calc(32px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  /* Opened from the home screen: no way back to the parent site from inside the app. */
  @media (display-mode: standalone){ .home-link{ display:none; } }

  .site-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:22px; }
  .home-link{ display:inline-block; font-family:var(--font-m); font-size:12px; letter-spacing:0.04em; color:var(--accent); text-decoration:none; margin:0 0 14px; }
  .home-link:hover{ text-decoration:underline; text-underline-offset:3px; }
  .eyebrow{ font-family:var(--font-m); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--on-bg-soft); margin:0 0 6px; }
  /* The tea glass from the app icon, beside the name; the name itself is redrawn per language. */
  .brand{ display:flex; align-items:flex-start; gap:clamp(10px,1.4vw,14px); }
  .brand-mark{ flex:none; width:clamp(30px,4.2vw,44px); height:auto; margin-top:1px; }
  h1{ font-family:var(--font-d); font-weight:600; font-size:clamp(28px,4vw,42px); margin:0 0 6px; line-height:1.05; }
  h1 .en{ display:block; font-size:0.5em; font-weight:400; font-style:italic; color:var(--on-bg-soft); margin-top:4px; }
  .subtitle{ font-size:14px; color:var(--on-bg-soft); max-width:44ch; margin:0; line-height:1.5; }

  .controls{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .lang-toggle{
    display:inline-flex; background:var(--bg-2); border:1px solid rgba(var(--on-bg-rgb),0.25);
    border-radius:20px; overflow:hidden;
  }
  .lang-toggle button{
    background:none; border:none; color:var(--on-bg); font-family:var(--font-m); font-size:12px;
    letter-spacing:0.06em; padding:9px 12px; cursor:pointer; opacity:0.6; transition:background .15s, opacity .15s;
  }
  .lang-toggle button + button{ border-left:1px solid rgba(var(--on-bg-rgb),0.15); }
  .lang-toggle button:hover{ background:rgba(var(--on-bg-rgb),0.07); opacity:1; }
  .lang-toggle button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); opacity:1; font-weight:600; }
  .theme-toggle{
    background:var(--bg-2); border:1px solid rgba(var(--on-bg-rgb),0.25); color:var(--on-bg);
    border-radius:20px; padding:7px 11px; font-size:15px; line-height:1; cursor:pointer; transition:background .15s;
  }
  .theme-toggle:hover{ background:rgba(var(--on-bg-rgb),0.07); }
  .liked-filter{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--on-bg); cursor:pointer; user-select:none; }
  .liked-filter input{ accent-color:var(--like); width:16px; height:16px; cursor:pointer; }
  .liked-filter.text-filter input{ accent-color:var(--badge-text-fg); }

  .import-bar{ display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .import-input{
    flex:1; min-width:220px; background:var(--paper); border:2px solid var(--accent);
    color:var(--ink); padding:12px 14px; border-radius:8px; font-size:14.5px;
  }
  .import-input::placeholder{ color:var(--muted-ink); }
  .import-btn{
    background:var(--accent); color:var(--on-accent); border:none; padding:12px 20px; border-radius:8px;
    font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
  }
  .import-btn:hover{ background:var(--accent-dark); }
  .import-btn:disabled{ opacity:0.6; cursor:wait; }
  .import-status{ font-size:13px; color:var(--on-bg); margin:0 0 14px; line-height:1.4; }
  .import-status.error{ color:var(--danger); }
  .paste-toggle{
    background:none; border:none; padding:0; margin:-6px 0 14px; color:var(--on-bg); opacity:0.75;
    font-size:13px; text-decoration:underline; cursor:pointer;
  }
  .paste-toggle:hover{ opacity:1; }
  .paste-box{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; margin-bottom:14px; }
  .paste-text{ width:100%; box-sizing:border-box; min-height:140px; resize:vertical; font-family:inherit; line-height:1.45; }
  .toolbar{ display:flex; gap:10px; margin:18px 0 22px; flex-wrap:wrap; }
  .search-input{
    flex:1; min-width:200px; background:var(--paper); border:1px solid rgba(var(--on-bg-rgb),0.2);
    color:var(--on-bg); padding:11px 14px; border-radius:8px; font-size:14px;
  }
  .search-input::placeholder{ color:var(--muted-ink); }
  .idea-btn{
    background:transparent; border:1px solid var(--accent); color:var(--accent);
    padding:11px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap; transition:background .15s, color .15s;
  }
  .idea-btn:hover{ background:var(--accent); color:var(--on-accent); }

  .idea-callout{
    background:var(--accent); color:var(--on-accent); border-radius:10px; padding:16px 18px;
    margin-bottom:20px; display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
    box-shadow:var(--shadow); animation:pop .25s ease;
  }
  .idea-callout .idea-label{ font-family:var(--font-m); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.7; margin:0 0 4px; }
  .idea-callout .idea-title{ font-family:var(--font-d); font-weight:600; font-size:20px; margin:0 0 2px; }
  .idea-callout .idea-title .en{ display:block; font-size:0.65em; font-style:italic; font-weight:400; opacity:0.75; }
  .idea-callout .idea-note{ font-size:13px; margin:6px 0 0; max-width:60ch; opacity:0.85; }
  .idea-callout-actions{ display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .idea-callout-actions button{
    background:rgba(var(--on-accent-rgb),0.16); border:none; color:var(--on-accent); padding:7px 12px;
    border-radius:6px; font-size:12px; cursor:pointer; font-weight:600;
  }
  .idea-callout-actions button:hover{ background:rgba(var(--on-accent-rgb),0.28); }

  .tabs{ display:flex; gap:6px; overflow-x:auto; padding:0 0 0 6px; scrollbar-width:thin; }
  .tab{
    background:var(--bg-2); color:var(--on-bg-soft); font-family:var(--font-m); font-size:12px;
    letter-spacing:0.05em; text-transform:uppercase; padding:11px 16px 9px; border-radius:9px 9px 0 0;
    cursor:pointer; border:none; position:relative; top:2px; white-space:nowrap; flex-shrink:0;
    transition:background .15s, color .15s;
  }
  .tab .count{ opacity:0.6; margin-left:5px; }
  .tab.active{ background:var(--card); color:var(--ink); top:0; font-weight:600; box-shadow:var(--tab-shadow); }
  .tab.active .count{ opacity:0.5; }
  .tab[data-cat="dinner"].active{ box-shadow: inset 0 3px 0 var(--cat-dinner), var(--tab-shadow); }
  .tab[data-cat="breakfast"].active{ box-shadow: inset 0 3px 0 var(--cat-breakfast), var(--tab-shadow); }
  .tab[data-cat="snack"].active{ box-shadow: inset 0 3px 0 var(--cat-snack), var(--tab-shadow); }
  .tab[data-cat="dessert"].active{ box-shadow: inset 0 3px 0 var(--cat-dessert), var(--tab-shadow); }
  .tab[data-cat="inbox"].active{ box-shadow: inset 0 3px 0 var(--cat-inbox), var(--tab-shadow); }

  .board{
    background:var(--card); border-radius:0 10px 10px 10px; padding:22px;
    box-shadow:var(--shadow); min-height:260px;
  }
  .inbox-info{
    font-size:13px; color:var(--muted-ink); background:rgba(var(--ink-rgb),0.06);
    border:1px dashed rgba(var(--ink-rgb),0.25); border-radius:8px; padding:12px 14px; margin-bottom:16px; line-height:1.5;
  }
  .tag-filter{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .chip{
    font-family:var(--font-m); font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;
    padding:5px 10px; border-radius:20px; border:1px solid rgba(var(--ink-rgb),0.2); background:transparent;
    color:var(--muted-ink); cursor:pointer;
  }
  .chip:hover{ background:rgba(var(--ink-rgb),0.06); }
  .chip.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--muted-ink); }
  .empty-state p{ margin:0 0 14px; font-size:14px; }
  .empty-state button{
    background:var(--accent); color:var(--on-accent); border:none; padding:10px 18px;
    border-radius:8px; font-weight:600; cursor:pointer; font-size:13px;
  }

  .card{
    background:var(--paper); border-radius:8px; padding:16px 16px 14px; position:relative;
    border:1px solid rgba(var(--ink-rgb),0.08); transition:transform .15s, box-shadow .15s;
    display:flex; flex-direction:column;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 8px 18px rgba(var(--shadow-rgb),0.12); }
  .card .accent-bar{ position:absolute; top:0; left:0; right:0; height:4px; border-radius:8px 8px 0 0; }
  .card[data-cat="dinner"] .accent-bar{ background:var(--cat-dinner); }
  .card[data-cat="breakfast"] .accent-bar{ background:var(--cat-breakfast); }
  .card[data-cat="snack"] .accent-bar{ background:var(--cat-snack); }
  .card[data-cat="dessert"] .accent-bar{ background:var(--cat-dessert); }
  .card[data-cat="inbox"] .accent-bar{ background:var(--cat-inbox); }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-top:4px; }
  .catalog-no{ font-family:var(--font-m); font-size:10px; color:var(--muted-ink); letter-spacing:0.05em; }
  .like-btn{
    background:none; border:none; font-size:19px; cursor:pointer; line-height:1; padding:0 0 0 8px;
    color:var(--like-idle); transition:transform .12s;
  }
  .like-btn.liked{ color:var(--like); }
  .like-btn.pop{ animation:pop .3s ease; }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);} }

  .card-title{
    font-family:var(--font-d); font-weight:600; font-size:17px; color:var(--ink); margin:8px 0 2px; line-height:1.25;
    border-bottom:1px solid rgba(var(--ink-rgb),0.14); padding-bottom:8px; background:none; border-top:none; border-left:none; border-right:none;
    text-align:left; cursor:pointer; padding-left:0; padding-right:0; width:100%;
  }
  .card-title:hover .primary{ text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
  .card-title .secondary{ display:block; font-size:0.72em; font-weight:400; font-style:italic; color:var(--muted-ink); margin-top:2px; }
  .badge-row{ display:flex; gap:6px; margin:8px 0 0; flex-wrap:wrap; }
  .badge{ font-family:var(--font-m); font-size:10px; letter-spacing:0.04em; text-transform:uppercase; padding:3px 8px; border-radius:20px; background:rgba(var(--ink-rgb),0.08); color:var(--muted-ink); }
  .badge.formula{ background:var(--badge-formula-bg); color:var(--badge-formula-fg); }
  .badge.has-text{ background:var(--badge-text-bg); color:var(--badge-text-fg); }
  .card-note{ font-size:12.5px; color:var(--muted-ink); line-height:1.5; margin:10px 0 0; }
  .card-note .secondary{ display:block; font-style:italic; opacity:0.85; margin-top:3px; }
  .card-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:12px; gap:8px; }
  .open-link{ font-size:12px; font-weight:600; color:var(--accent-dark); text-decoration:none; display:inline-flex; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:0; }
  .open-link:hover{ text-decoration:underline; }
  .icon-btns{ display:flex; gap:4px; opacity:0; transition:opacity .15s; }
  .card:hover .icon-btns, .card:focus-within .icon-btns{ opacity:1; }
  @media (hover:none){ .icon-btns{ opacity:1; } }
  .icon-btn{ background:none; border:none; cursor:pointer; font-size:13px; color:var(--muted-ink); padding:4px; border-radius:5px; }
  .icon-btn:hover{ background:rgba(var(--ink-rgb),0.08); }

  .fab{
    position:fixed; right:calc(24px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom));
    background:var(--accent); color:var(--on-accent); border:none; padding:14px 22px; border-radius:30px; font-weight:700; font-size:14px;
    box-shadow:0 8px 22px rgba(var(--shadow-rgb),0.3); cursor:pointer; transition:transform .12s, background .15s;
    z-index:20;
  }
  .fab:hover{ background:var(--accent-dark); transform:translateY(-2px); }

  .footer{ margin-top:26px; display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--on-bg-soft); align-items:center; }
  .footer a{ color:var(--on-bg-soft); }
  .footer a:hover{ color:var(--on-bg); }

  .modal-overlay{
    position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center;
    justify-content:center; z-index:50;
    padding:max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .modal{
    background:var(--card); border-radius:12px; padding:26px; width:100%; max-width:560px;
    max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(var(--shadow-rgb),0.35); color:var(--ink);
  }
  .modal.wide{ max-width:720px; }
  .modal.form{ max-width:900px; }
  .modal h2{ font-family:var(--font-d); color:var(--ink); font-size:20px; margin:0 0 16px; }
  .field{ margin-bottom:13px; }
  .field label, .field .label{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-family:var(--font-m); font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted-ink); margin-bottom:5px; }
  .field input[type=text], .field input[type=url], .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid rgba(var(--ink-rgb),0.25); border-radius:6px;
    font-size:13.5px; background:var(--paper); color:var(--ink); resize:vertical;
  }
  .field textarea{ min-height:56px; }
  .field textarea.recipe-text{ min-height:150px; font-size:13px; line-height:1.45; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; min-width:0; }
  .field-row .field.field-narrow{ flex:0 0 110px; }
  .field-hint{ font-size:11.5px; color:var(--muted-ink); margin-top:4px; line-height:1.4; }
  .mini-btn{
    font-family:var(--font-b); text-transform:none; letter-spacing:0; font-size:11.5px; font-weight:600;
    background:rgba(var(--ink-rgb),0.08); border:none; color:var(--ink); padding:4px 9px; border-radius:5px; cursor:pointer; white-space:nowrap;
  }
  .mini-btn:hover{ background:rgba(var(--ink-rgb),0.16); }
  .mini-btn:disabled{ opacity:0.5; cursor:wait; }
  .checkbox-field{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .checkbox-field input{ width:16px; height:16px; }
  .checkbox-field label{ margin:0; text-transform:none; letter-spacing:0; font-size:13px; font-family:var(--font-b); color:var(--ink); }
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:8px; flex-wrap:wrap; }
  .btn-primary{ background:var(--accent); color:var(--on-accent); border:none; padding:10px 20px; border-radius:8px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-secondary{ background:none; border:1px solid rgba(var(--ink-rgb),0.25); color:var(--ink); padding:10px 16px; border-radius:8px; font-size:13.5px; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn-secondary:hover{ background:rgba(var(--ink-rgb),0.06); }
  .btn-danger{ background:none; border:none; color:var(--danger); font-size:12.5px; cursor:pointer; text-decoration:underline; }

  /* recipe detail */
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .detail-title{ font-family:var(--font-d); font-weight:600; font-size:24px; margin:0; line-height:1.2; }
  .detail-title .secondary{ display:block; font-size:0.62em; font-weight:400; font-style:italic; color:var(--muted-ink); margin-top:4px; }
  .detail-head .like-btn{ font-size:26px; }
  .detail-note{ font-size:13.5px; color:var(--muted-ink); line-height:1.5; margin:12px 0 0; }
  .seg{ display:inline-flex; border:1px solid rgba(var(--ink-rgb),0.25); border-radius:20px; overflow:hidden; margin:18px 0 10px; }
  .seg button{ background:none; border:none; padding:6px 13px; font-family:var(--font-m); font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted-ink); cursor:pointer; }
  .seg button + button{ border-left:1px solid rgba(var(--ink-rgb),0.2); }
  .seg button.active{ background:var(--ink); color:var(--paper); }
  .recipe-body{
    background:var(--paper); border-radius:8px; padding:16px 18px; font-size:14px; line-height:1.6;
    white-space:pre-wrap; word-wrap:break-word; border:1px solid rgba(var(--ink-rgb),0.08);
  }
  .recipe-body .qty{ background:var(--qty-bg); border-radius:3px; padding:0 2px; font-weight:700; }
  .servings{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:16px 0 0; font-size:13px; }
  .servings-label{ color:var(--muted-ink); }
  .servings-pick{ display:inline-flex; gap:6px; flex-wrap:wrap; }
  .servings-pick .chip{ min-width:34px; font-size:12px; }
  .stepper{ display:inline-flex; align-items:center; border:1px solid rgba(var(--ink-rgb),0.25); border-radius:20px; overflow:hidden; }
  .stepper button{ background:none; border:none; width:34px; height:30px; font-size:17px; line-height:1; color:var(--ink); cursor:pointer; }
  .stepper button:hover{ background:rgba(var(--ink-rgb),0.07); }
  .stepper button:disabled{ opacity:0.35; cursor:default; background:none; }
  .stepper output{ min-width:26px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; }
  .recipe-body.empty{ color:var(--muted-ink); font-style:italic; white-space:normal; }
  .translate-row{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; font-size:12px; color:var(--muted-ink); }
  .embed-wrap{ margin-top:14px; border-radius:8px; overflow:hidden; background:#fff; }
  .embed-wrap iframe{ width:100%; height:620px; border:0; display:block; }

  .toast{
    position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink);
    color:var(--paper); padding:10px 18px; border-radius:20px; font-size:13px; z-index:60;
    box-shadow:0 8px 20px rgba(var(--shadow-rgb),0.3); max-width:90vw; text-align:center;

  @media (max-width:640px){

    .site-header{ flex-direction:column; }
    .board{ padding:16px; }

    .chip{ flex-shrink:0; }

    .embed-wrap iframe{ height:520px; }

<body>
<div class="wrap">

  <header class="site-header">
    <div>
      <a class="home-link" href="https://mhjansen.nl">← mhjansen.nl</a>
      <p class="eyebrow"><span lang="tr">Afiyet olsun</span> · <span lang="nl">Eet smakelijk</span> · <span lang="en">Enjoy your meal</span></p>
      <div class="brand">
        <img class="brand-mark" src="/icons/favicon.svg" alt="" width="44" height="44">
        <h1 id="pageTitle"><span>Çok Lekker</span></h1>
      </div>
      <p class="subtitle" id="pageSubtitle"></p>
    </div>
    <div class="controls">
      <label class="liked-filter"><input type="checkbox" id="likedOnly"> <span id="likedOnlyLabel"></span></label>
      <label class="liked-filter text-filter"><input type="checkbox" id="textOnly"> <span id="textOnlyLabel"></span></label>
      <button type="button" class="theme-toggle" id="themeToggle"></button>
      <div class="lang-toggle" id="langToggle" role="group" aria-label="Dil / Language / Taal">
        <button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="nl">NL</button>
      </div>
    </div>
  </header>

  <form class="import-bar" id="importForm">
    <input type="url" class="import-input" id="importInput" inputmode="url" autocomplete="off" required>
    <button type="submit" class="import-btn" id="importSubmit"></button>
  </form>
  <p class="import-status hidden" id="importStatus"></p>
  <button type="button" class="paste-toggle" id="pasteToggle"></button>
  <form class="paste-box hidden" id="pasteForm">
    <textarea class="import-input paste-text" id="pasteText" rows="7" required></textarea>
    <button type="submit" class="import-btn" id="pasteSubmit"></button>
  </form>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput">
    <button class="idea-btn" id="ideaBtn"></button>
  </div>

  <div id="ideaCalloutSlot"></div>

  <nav class="tabs" id="tabs"></nav>
  <div class="board">
    <div id="inboxInfoSlot"></div>
    <div class="tag-filter" id="tagFilter"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="footer">
    <span id="aiNote"></span>
    <a href="/api/export" id="exportBtn"></a>
  </div>

</div>

<button class="fab" id="addBtn">✎ <span id="addBtnLabel"></span></button>

<!-- recipe detail -->
<div class="modal-overlay hidden" id="detailOverlay">
  <div class="modal wide" id="detailModal" role="dialog" aria-modal="true"></div>
</div>

<!-- add / edit -->
<div class="modal-overlay hidden" id="modalOverlay">
  <form class="modal wide form" id="recipeForm">
    <h2 id="modalTitle"></h2>

    <div class="field">
      <label for="fLink" id="lblLink"></label>
      <input type="url" id="fLink" placeholder="https://www.instagram.com/reel/...">
      <div class="field-hint" id="linkHint"></div>
      <div style="margin-top:6px;"><button type="button" class="mini-btn" id="previewPostBtn"></button></div>
      <div class="embed-wrap hidden" id="formEmbed"></div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="fTitleTr" id="lblTitleTr"></label>
        <input type="text" id="fTitleTr">
      </div>
      <div class="field">
        <label for="fTitleEn" id="lblTitleEn"></label>
        <input type="text" id="fTitleEn">
      </div>
      <div class="field">
        <label for="fTitleNl" id="lblTitleNl"></label>
        <input type="text" id="fTitleNl">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="fCategory" id="lblCategory"></label>
        <select id="fCategory"></select>
      </div>
      <div class="field">
        <label for="fTags" id="lblTags"></label>
        <input type="text" id="fTags">
      </div>
      <div class="field field-narrow">
        <label for="fServings" id="lblServings"></label>
        <input type="number" id="fServings" min="1" max="99" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label for="fCaption"><span id="lblCaption"></span><button type="button" class="mini-btn" id="captionToBothBtn"></button></label>
      <textarea id="fCaption" class="recipe-text" style="min-height:90px;"></textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="fTextTr"><span id="lblTextTr"></span><button type="button" class="mini-btn fill-btn" data-lang="tr"></button></label>
        <textarea id="fTextTr" class="recipe-text"></textarea>
      </div>
      <div class="field">
        <label for="fTextEn"><span id="lblTextEn"></span><button type="button" class="mini-btn fill-btn" data-lang="en"></button></label>
        <textarea id="fTextEn" class="recipe-text"></textarea>
      </div>
      <div class="field">
        <label for="fTextNl"><span id="lblTextNl"></span><button type="button" class="mini-btn fill-btn" data-lang="nl"></button></label>
        <textarea id="fTextNl" class="recipe-text"></textarea>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="fNoteTr" id="lblNoteTr"></label>
        <textarea id="fNoteTr"></textarea>
      </div>
      <div class="field">
        <label for="fNoteEn" id="lblNoteEn"></label>
        <textarea id="fNoteEn"></textarea>
      </div>
      <div class="field">
        <label for="fNoteNl" id="lblNoteNl"></label>
        <textarea id="fNoteNl"></textarea>
      </div>
    </div>

    <div class="checkbox-field">
      <input type="checkbox" id="fFormula">
      <label id="lblFormula" for="fFormula"></label>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-danger hidden" id="deleteBtn"></button>
      <div style="display:flex; gap:8px; margin-left:auto;">
        <button type="button" class="btn-secondary" id="cancelBtn"></button>
        <button type="submit" class="btn-primary" id="saveBtn"></button>
      </div>
    </div>
  </form>
</div>

<div class="toast hidden" id="toast"></div>

      validationTitle:'Vul in minstens één taal een titel in.',
      exportBtn:'Back-up downloaden (JSON)',
      aiOn:'{ai} maakt geïmporteerde recepten netjes op en vertaalt ze.',
      aiOff:'Eenvoudige import: het bijschrift wordt vertaald, jij kiest de titel en categorie.',
      importPlaceholder:'Plak een link van Instagram, TikTok, YouTube of een receptensite…',
      importBtn:'Recept toevoegen', importing:'Even sudderen…',
      pasteToggle:'Laadt de site niet? Plak de recepttekst', pasteBtn:'Recept toevoegen uit tekst',
      pastePlaceholder:'Plak hier de tekst van het recept (ingrediënten en bereiding). De link hierboven blijft bewaard als bron.',
      importWorking:'De link wordt gelezen en het recept klaargezet, dit kan even duren…',
      importDone:'Recept toegevoegd', importInbox:'Recept op het aanrecht gezet; controleer de titel en categorie.',
      importDuplicate:'Dit recept staat al in het archief.',

      offline:'Offline: je ziet de recepten van je vorige bezoek. Wijzigingen kunnen niet worden opgeslagen.'
    }
  };

  function t(key){ return I18N[state.lang][key]; }
  function cap(lang){ return lang.charAt(0).toUpperCase() + lang.slice(1); }

  // The UI language first, then the one shown under it, then the rest.
  function langOrder(){
    var order = [state.lang, SECONDARY[state.lang]];
    return order.concat(LANGS.filter(function(l){ return order.indexOf(l) === -1; }));
  }
  // A recipe's title/text/note in the first language that has one.
  function pick(r, field){
    var order = langOrder();
    for(var i = 0; i < order.length; i++){ if(r[field + cap(order[i])]) return r[field + cap(order[i])]; }
    return '';
  }
  // The language to translate a missing text from: the original one when it has text, else the first that does.
  function sourceLang(hasText, target, orig){
    var order = [orig].concat(LANGS);
    for(var i = 0; i < order.length; i++){
      var l = order[i];
      if(l && l !== target && LANGS.indexOf(l) !== -1 && hasText(l)) return l;
    }
    return null;
  }

  function catLabel(cat){
    var c = CATEGORIES.filter(function(x){return x.id===cat;})[0];
    return c ? c[state.lang] : cat;
  }
  function tagLabel(tag){ return TAGS[tag] ? TAGS[tag][state.lang] : tag; }

  function esc(s){
    if(!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function igCode(link){
    var m = /instagram\.com\/(?:[\w.]+\/)?(?:p|reel|reels|tv)\/([\w-]+)/.exec(link || '');
    return m ? m[1] : null;
  }

  /* ---------- server API ---------- */

  async function api(method, path, body){
    var res = await fetch(path, {
      method:method,
      headers: body ? { 'Content-Type':'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
      redirect:'manual'
    });
    // The server never redirects, so a redirect means a login proxy in front of it
    // (e.g. Authentik) wants a new sign-in. Reload so the browser follows it to the
    // login page; the guard stops a reload loop if the sign-in keeps failing.
    if(res.type === 'opaqueredirect'){
      var last = 0;
      try{ last = +sessionStorage.getItem('recipebook-relogin') || 0; }catch(e){}
      if(Date.now() - last > 30000){
        try{ sessionStorage.setItem('recipebook-relogin', String(Date.now())); }catch(e){}
        location.reload();
      }
      throw new Error(t('sessionExpired'));
    }
    // The service worker answered with its saved copy because the network is gone.
    if(res.headers.get('X-Offline')) state.offline = true;
    var data = {};
    try{ data = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function loadData(){
    var data = await api('GET', '/api/recipes');
    state.recipes = data.recipes;
    state.ai = data.ai || '';
  }

  // Save the given fields of a recipe and replace the local copy with the server's.
  async function saveRecipe(r, fields){
    try{
      var data = await api('PUT', '/api/recipes/' + encodeURIComponent(r.id), fields);
      Object.assign(r, data.recipe);
      return true;
    }catch(e){
      showToast(t('saveFailed') + ' ' + e.message);
      return false;
    }
  }

  // The chosen language lives in a cookie for a year; older versions kept it in localStorage.
  function loadLang(){
    var m = document.cookie.match(new RegExp('(?:^|; )' + LANG_KEY + '=([^;]*)'));
    if(m) return decodeURIComponent(m[1]);
    try{ return localStorage.getItem(LANG_KEY); }catch(e){ return null; }
  }
  function saveLang(){
    document.cookie = LANG_KEY + '=' + encodeURIComponent(state.lang) + '; Path=/; Max-Age=31536000; SameSite=Lax' +
      (location.protocol === 'https:' ? '; Secure' : '');
    try{ localStorage.removeItem(LANG_KEY); }catch(e){}
  }

  // Light/dark: <head> already applied the saved choice or the device setting before first paint.
  // Only an explicit click is saved, so without one the page keeps following the device.
  function currentTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    var btn = document.getElementById('themeToggle');
    var label = t(theme === 'dark' ? 'toLight' : 'toDark');
    btn.textContent = theme === 'dark' ? '\u2600\uFE0E' : '\u263E';
    btn.setAttribute('aria-label', label);
    btn.title = label;
  }
  function saveTheme(theme){
    document.cookie = THEME_KEY + '=' + theme + '; Path=/; Max-Age=31536000; SameSite=Lax' +
      (location.protocol === 'https:' ? '; Secure' : '');
  }
  function hasSavedTheme(){ return new RegExp('(?:^|; )' + THEME_KEY + '=').test(document.cookie); }

  /* ---------- translation (done by the server) ---------- */

  async function translate(text, from, to){
    if(!text || !text.trim()) return '';
    try{
      var data = await api('POST', '/api/translate', { text:text, from:from, to:to });
      return data.text;
    }catch(e){
      showToast(t('translateFailed'));
      window.open('https://translate.google.com/?sl=' + (from === 'auto' ? 'auto' : from) + '&tl=' + to + '&op=translate&text=' + encodeURIComponent(text.slice(0, 4500)), '_blank', 'noopener');
      return null;
    }
  }
  function guessLang(text){
    if(/[çğıöşüÇĞİÖŞÜ]/.test(text)) return 'tr';
    var counts = {
      tr: (text.match(/\b(ve|bir|için|ile|kadar|olarak|tuz|su bardağı|yemek kaşığı)\b/gi) || []).length,
      en: (text.match(/\b(and|the|with|for|cup|tbsp|tsp|until|minutes)\b/gi) || []).length,
      // not "en"/"de": those are common Turkish words too
      nl: (text.match(/\b(het|een|met|voor|van|minuten|eetlepels?|theelepels?|snufje|ongeveer)\b/gi) || []).length
    };
    var best = LANGS.reduce(function(a, b){ return counts[b] > counts[a] ? b : a; });
    return counts[best] ? best : 'auto';
  }

  /* ---------- state & helpers ---------- */

  var state = { lang:'tr', likedOnly:false, textOnly:false, search:'', activeCategory:'dinner', activeTag:null, recipes:[], ai:false, editingId:null };
  var currentIdeaId = null;
  var detailId = null, detailView = null;

  function showToast(msg, ms){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ el.classList.add('hidden'); }, ms || 2200);
  }

  function openLabel(r){
    var site = { tiktok:'TikTok', youtube:'YouTube' }[r.platform];
    if(!site && /instagram\.com/.test(r.link)) return t('open');
    if(!site){ try{ site = new URL(r.link).hostname.replace(/^www\./, ''); }catch(e){ return t('open'); } }
    return t('openAt').replace('{site}', site);
  }

  function getRecipe(id){ return state.recipes.filter(function(r){return r.id===id;})[0]; }

  // Whether there is a recipe to read: the original caption or a text in any language.
  function hasRecipeText(r){ return !!(r.caption || pick(r, 'text')); }

  function titles(r){
    var primary = pick(r, 'title');
    var secondary = r['title' + cap(SECONDARY[state.lang])] || '';
    if(secondary === primary) secondary = '';
    if(!primary){ primary = igCode(r.link) ? '📎 ' + igCode(r.link) : t('untitled'); }
    return { primary:primary, secondary:secondary };
  }

  function haystack(r){
    var parts = [r.caption, r.author];
    LANGS.forEach(function(l){ parts.push(r['title' + cap(l)], r['note' + cap(l)], r['text' + cap(l)]); });
    (r.tags||[]).forEach(function(x){
      parts.push(TAGS[x] ? LANGS.map(function(l){ return TAGS[x][l]; }).join(' ') : x);
    });
    return parts.join(' ').toLocaleLowerCase('tr');
  }

  function filteredRecipes(){
    var q = state.search.trim().toLocaleLowerCase('tr');
    return state.recipes.filter(function(r){
      if(r.category !== state.activeCategory) return false;
      if(state.likedOnly && !r.liked) return false;
      if(state.textOnly && !hasRecipeText(r)) return false;
      if(state.activeTag && (r.tags||[]).indexOf(state.activeTag) === -1) return false;
      if(q && haystack(r).indexOf(q) === -1) return false;
      return true;
    });
  }

  /* ---------- rendering ---------- */

  function renderChrome(){
    document.documentElement.lang = state.lang;

  function renderTabs(){
    var tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    CATEGORIES.forEach(function(c){
      var count = state.recipes.filter(function(r){ return r.category===c.id; }).length;
      if(c.id === 'inbox' && count === 0 && state.activeCategory !== 'inbox') return;
      var btn = document.createElement('button');
      btn.className = 'tab' + (c.id===state.activeCategory ? ' active' : '');
      btn.setAttribute('data-cat', c.id);
      btn.innerHTML = esc(c[state.lang]) + '<span class="count">' + count + '</span>';
      btn.addEventListener('click', function(){
        state.activeCategory = c.id;
        state.activeTag = null;
        currentIdeaId = null;
        document.getElementById('ideaCalloutSlot').innerHTML = '';
        renderAll();
      });
      tabsEl.appendChild(btn);
    });

  function renderTagFilter(){
    var el = document.getElementById('tagFilter');
    var counts = {};
    state.recipes.forEach(function(r){
      if(r.category !== state.activeCategory) return;
      (r.tags||[]).forEach(function(tag){ counts[tag] = (counts[tag]||0) + 1; });
    });
    var tags = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
    if(tags.length < 2){ el.innerHTML = ''; el.classList.add('hidden'); return; }
    el.classList.remove('hidden');
    var html = '<button class="chip' + (state.activeTag ? '' : ' active') + '" data-tag="">' + esc(t('allTags')) + '</button>';
    tags.forEach(function(tag){
      html += '<button class="chip' + (state.activeTag===tag ? ' active' : '') + '" data-tag="' + esc(tag) + '">' + esc(tagLabel(tag)) + ' <span style="opacity:.6">' + counts[tag] + '</span></button>';
    });
    el.innerHTML = html;
    el.querySelectorAll('.chip').forEach(function(b){
      b.addEventListener('click', function(){
        state.activeTag = b.getAttribute('data-tag') || null;
        renderTagFilter(); renderGrid();
      });
    });
  }

  function cardHtml(r, idx){
    var tt = titles(r);
    var primaryNote = pick(r, 'note');
    var secondaryNote = r['note' + cap(SECONDARY[state.lang])] || '';
    if(secondaryNote === primaryNote) secondaryNote = '';
    var hasText = hasRecipeText(r);

    var html = '<div class="card" data-cat="' + esc(r.category) + '" data-id="' + esc(r.id) + '">';
    html += '<div class="accent-bar"></div>';
    html += '<div class="card-top"><span class="catalog-no">No. ' + String(idx+1).padStart(3,'0') + '</span>';
    html += '<button class="like-btn' + (r.liked?' liked':'') + '" data-id="' + esc(r.id) + '" aria-label="like">' + (r.liked ? '♥' : '♡') + '</button></div>';
    html += '<button class="card-title open-detail" data-id="' + esc(r.id) + '"><span class="primary">' + esc(tt.primary) + '</span>' + (tt.secondary ? '<span class="secondary">'+esc(tt.secondary)+'</span>' : '') + '</button>';
    var badges = '';
    if(r.formula) badges += '<span class="badge formula">' + esc(t('formula')) + '</span>';
    if(hasText) badges += '<span class="badge has-text">📄 ' + esc(t('hasText')) + '</span>';
    (r.tags||[]).slice(0,3).forEach(function(tag){ badges += '<span class="badge">' + esc(tagLabel(tag)) + '</span>'; });
    if(badges) html += '<div class="badge-row">' + badges + '</div>';
    if(primaryNote){
      html += '<div class="card-note">' + esc(primaryNote) + (secondaryNote ? '<span class="secondary">'+esc(secondaryNote)+'</span>' : '') + '</div>';
    }
    html += '<div class="card-actions">';
    html += '<button class="open-link open-detail" data-id="' + esc(r.id) + '">' + esc(t('showRecipe')) + ' →</button>';
    html += '<div class="icon-btns">';
    if(r.link) html += '<a class="icon-btn" href="'+esc(r.link)+'" target="_blank" rel="noopener" aria-label="' + esc(openLabel(r)) + '" title="' + esc(openLabel(r)) + '">↗</a>';
    html += '<button class="icon-btn edit-btn" data-id="'+esc(r.id)+'" aria-label="edit">✎</button><button class="icon-btn del-btn" data-id="'+esc(r.id)+'" aria-label="delete">🗑</button></div>';
    html += '</div></div>';
    return html;
  }

  function renderGrid(){
    var grid = document.getElementById('grid');
    var list = filteredRecipes();
    if(list.length === 0){
      var filtered = state.likedOnly || state.textOnly;
      var msg = state.textOnly ? t('emptyFiltered') : state.likedOnly ? t('emptyLiked') : t('emptyMsg');
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>' + esc(msg) + '</p>' +
        (filtered || state.activeCategory==='inbox' ? '' : '<button id="emptyAddBtn">' + esc(t('emptyBtn')) + '</button>') + '</div>';

  }

  /* ---------- recipe detail ---------- */

  function embedHtml(link){
    var code = igCode(link);
    if(!code) return '';
    return '<iframe src="https://www.instagram.com/p/' + esc(code) + '/embed/captioned/" loading="lazy" allowtransparency="true" title="Instagram"></iframe>';
  }

  /* ---------- servings ---------- */

  // "Serves 4", "4 kişilik", "voor 4 personen": a count a recipe's own text states.
  var SERVES_RES = [
    /\bserves\s+(\d+)/i, /\bfor\s+(\d+)\s+(?:people|persons)\b/i, /\b(\d+)\s+(?:servings|portions)\b/i,
    /\b(\d+)\s*kişilik/i, /\b(\d+)\s+porsiyon/i,
    /\bvoor\s+(\d+)\s+personen\b/i, /\b(\d+)\s+(?:personen|porties)\b/i
  ];
  function statedServings(r){
    var texts = LANGS.map(function(l){ return r['text' + cap(l)]; }).concat(r.caption);
    for(var i = 0; i < texts.length; i++){
      for(var j = 0; texts[i] && j < SERVES_RES.length; j++){
        var m = texts[i].match(SERVES_RES[j]);
        if(m && +m[1] >= 1 && +m[1] <= 50) return +m[1];
      }
    }
    return 0;
  }
  // How many people the amounts are for: the saved number, else the one the text states, else 0 (unknown).
  function baseServings(r){ return r.servings || statedServings(r); }

  // An amount: 1 1/2, 1½, 1/2, 1,5, 200, ½; optionally a range (15-20). Not a percentage or temperature.
  var FRAC = { '½':1/2, '¼':1/4, '¾':3/4, '⅓':1/3, '⅔':2/3, '⅛':1/8 };
  var NUM = '(?:\\d+\\s+\\d+/\\d+|\\d+\\s*[½¼¾⅓⅔⅛]|\\d+/\\d+|\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔⅛])';
  var QTY_RE = new RegExp('(^|[^\\w/.,])(' + NUM + ')(?:(\\s*[-–]\\s*)(' + NUM + '))?(?![.,]?\\d|\\s*[%°])');
  // Amounts in words at the start of a line: "Yarım kilo", "Half a lemon", "Een kwart kool".
  var WORD_QTY = /^(half an?|half|yarım|een halve|halve|a quarter of an?|a quarter of|a quarter|çeyrek|een kwart)(?=\s)/i;
  var BULLET_RE = /^(\s*[-–•*]\s+)(.*)$/;
  // Turkish "2'şer", "1'er" (two each, one each): the suffix follows the number's sound.
  var TR_EACH = { 1:'er', 2:'şer', 3:'er', 4:'er', 5:'er', 6:'şar', 7:'şer', 8:'er', 9:'ar', 10:'ar' };
  var GLYPHS = [[0, ''], [1/8, '⅛'], [1/4, '¼'], [1/3, '⅓'], [1/2, '½'], [2/3, '⅔'], [3/4, '¾'], [1, '']];

  function parseQty(s){
    var m;
    if((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
    if((m = s.match(/^(\d*)\s*([½¼¾⅓⅔⅛])$/))) return (+m[1] || 0) + FRAC[m[2]];
    if((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
    return parseFloat(s.replace(',', '.'));
  }
  // Kitchen-friendly numbers: fractions below 10, whole numbers above, steps of 5 from 100.
  function fmtQty(x){
    if(x >= 100) return String(Math.round(x / 5) * 5);
    if(x >= 10) return String(Math.round(x));
    var whole = Math.floor(x), best = GLYPHS[0];
    GLYPHS.forEach(function(g){ if(Math.abs(x - whole - g[0]) < Math.abs(x - whole - best[0])) best = g; });
    if(best[0] === 1){ whole += 1; best = GLYPHS[0]; }
    if(!whole && !best[1]) best = GLYPHS[1];
    return (whole ? String(whole) : '') + best[1];
  }

  // An ingredient line (a "- " bullet) with its first amount multiplied by f, as HTML.
  function scaleLine(line, f){
    var m = line.match(BULLET_RE);
    if(!m) return null;
    var body = m[2], before = '', q, after;
    var w = body.match(WORD_QTY);
    if(w){
      q = fmtQty((/^(half|yarım|een halve|halve)/i.test(w[1]) ? 1/2 : 1/4) * f);
      after = body.slice(w[0].length);
    } else {
      var n = QTY_RE.exec(body);
      if(!n) return null;
      var a = parseQty(n[2]), b = n[4] ? parseQty(n[4]) : 0;
      if(!isFinite(a) || !isFinite(b)) return null;
      before = body.slice(0, n.index + n[1].length);
      q = fmtQty(a * f) + (n[4] ? n[3] + fmtQty(b * f) : '');
      after = body.slice(n.index + n[0].length);
      var s = after.match(/^(['’])ş?[ea]r(?![a-zçğıöşü])/i);
      if(s && TR_EACH[q]) after = s[1] + TR_EACH[q] + after.slice(s[0].length);
    }
    return esc(m[1] + before) + '<span class="qty">' + esc(q) + '</span>' + esc(after);
  }
  function servesLine(line, count){
    for(var i = 0; i < SERVES_RES.length; i++){
      var m = line.match(SERVES_RES[i]);
      if(!m) continue;
      var at = m.index + m[0].indexOf(m[1]);
      return esc(line.slice(0, at)) + '<span class="qty">' + count + '</span>' + esc(line.slice(at + m[1].length));
    }
    return null;
  }
  // A recipe text with its ingredient amounts (and any "Serves N" line) adjusted to count people.
  function scaledHtml(text, base, count){
    if(!base || count === base) return esc(text);
    return text.split('\n').map(function(line){
      return (BULLET_RE.test(line) ? scaleLine(line, count / base) : servesLine(line, count)) || esc(line);
    }).join('\n');
  }
  // Whether any of a recipe's texts has an ingredient line with an amount to adjust.
  function hasAmounts(r){
    return LANGS.some(function(l){
      return (r['text' + cap(l)] || '').split('\n').some(function(line){
        var m = line.match(BULLET_RE);
        return m && (WORD_QTY.test(m[2]) || QTY_RE.test(m[2]));
      });
    });
  }

  function servingsHtml(r){
    var base = baseServings(r), h = '';
    if(!base){
      h += '<span class="servings-label">👥 ' + esc(t('servingsAsk')) + '</span><span class="servings-pick">';
      for(var i = 1; i <= 6; i++) h += '<button class="chip" data-serves="' + i + '">' + i + '</button>';
      return h + '</span>';
    }
    h += '<span class="servings-label">👥 ' + esc(t('servings')) + '</span>';
    h += '<span class="stepper"><button data-step="-1" aria-label="−"' + (detailServings <= 1 ? ' disabled' : '') + '>−</button>';
    h += '<output aria-live="polite">' + detailServings + '</output>';
    h += '<button data-step="1" aria-label="+"' + (detailServings >= 99 ? ' disabled' : '') + '>+</button></span>';
    if(detailServings !== base) h += '<button class="mini-btn" data-step="0">↺ ' + esc(t('servingsReset').replace('{n}', base)) + '</button>';
    return h;
  }
  var detailServings = 0;

  // Redraw only the servings row and the recipe text, so an open post preview stays put.
  function renderServings(r){
    var bar = document.getElementById('servingsBar');
    if(bar) bar.innerHTML = servingsHtml(r);
    var body = document.getElementById('recipeBody');
    if(body && detailView !== 'orig') body.innerHTML = scaledHtml(r['text' + cap(detailView)], baseServings(r), detailServings);
    var note = document.getElementById('servingsOrigNote');
    if(note) note.classList.toggle('hidden', detailServings === baseServings(r));
  }

  async function onServingsClick(e){
    var r = getRecipe(detailId), btn = e.target.closest('button');
    if(!r || !btn) return;
    if(btn.hasAttribute('data-serves')){
      var n = +btn.getAttribute('data-serves');
      if(!await saveRecipe(r, { servings:n })) return;
      detailServings = n;
    } else {
      var step = +btn.getAttribute('data-step');
      detailServings = step ? Math.min(99, Math.max(1, detailServings + step)) : baseServings(r);
    }
    renderServings(r);
  }

  function openDetail(id){
    var r = getRecipe(id);
    if(!r) return;
    detailId = id;
    detailServings = baseServings(r);
    detailView = state.lang;
    if(!pick(r, 'text') && r.caption) detailView = 'orig';
    renderDetail();
    document.getElementById('detailOverlay').classList.remove('hidden');
  }

  function closeDetail(){
    document.getElementById('detailOverlay').classList.add('hidden');
    document.getElementById('detailModal').innerHTML = '';
    detailId = null;
  }

  function renderDetail(){
    var r = getRecipe(detailId);
    if(!r){ closeDetail(); return; }
    var tt = titles(r);
    var note = pick(r, 'note');
    var text = detailView === 'orig' ? r.caption : r['text' + cap(detailView)];

    var html = '<div class="detail-head"><div>';
    html += '<p class="eyebrow" style="color:var(--muted-ink)">' + esc(catLabel(r.category)) + (r.author ? ' · @' + esc(r.author) : '') + '</p>';
    html += '<h2 class="detail-title">' + esc(tt.primary) + (tt.secondary ? '<span class="secondary">' + esc(tt.secondary) + '</span>' : '') + '</h2>';
    html += '</div><button class="like-btn' + (r.liked?' liked':'') + '" id="detailLike" aria-label="like">' + (r.liked ? '♥' : '♡') + '</button></div>';

    var badges = '';
    if(r.formula) badges += '<span class="badge formula">' + esc(t('formula')) + '</span>';
    (r.tags||[]).forEach(function(tag){ badges += '<span class="badge">' + esc(tagLabel(tag)) + '</span>'; });
    if(badges) html += '<div class="badge-row">' + badges + '</div>';
    if(note) html += '<p class="detail-note">' + esc(note) + '</p>';

    var anyText = r.caption || pick(r, 'text');
    var scalable = hasAmounts(r);
    if(scalable) html += '<div class="servings" id="servingsBar">' + servingsHtml(r) + '</div>';
    if(anyText){
      html += '<div class="seg" role="tablist">';
      LANGS.forEach(function(l){
        html += '<button data-view="' + l + '" class="' + (detailView===l?'active':'') + '">' + esc(LANG_NAMES[l]) + '</button>';
      });
      if(r.caption) html += '<button data-view="orig" class="' + (detailView==='orig'?'active':'') + '">' + esc(t('original')) + '</button>';
      html += '</div>';
      if(text){
        html += '<div class="recipe-body" id="recipeBody">' + scaledHtml(text, detailView !== 'orig' && scalable && baseServings(r), detailServings) + '</div>';
        if(scalable && detailView === 'orig') html += '<div class="translate-row' + (detailServings === baseServings(r) ? ' hidden' : '') +
          '" id="servingsOrigNote">' + esc(t('servingsOrigNote')) + '</div>';
      } else {
        html += '<div class="recipe-body empty">' + esc(t('noText')) + '</div>';
        html += '<div class="translate-row"><button class="mini-btn" id="detailTranslate">⇄ ' + esc(t('translateNow')) + '</button></div>';
      }
      if(r.machine && r.machine[detailView]) html += '<div class="translate-row">⚙ ' + esc(t('machineNote')) + '</div>';
    } else {
      html += '<div class="recipe-body empty" style="margin-top:16px;">' + esc(t('noTextAtAll')) + '</div>';
    }

    html += '<div class="embed-wrap hidden" id="detailEmbed"></div>';

    html += '<div class="modal-actions">';
    html += '<div style="display:flex; gap:8px; flex-wrap:wrap;">';
    if(r.link){
      if(igCode(r.link)) html += '<button class="btn-secondary" id="detailEmbedBtn">▶ ' + esc(t('previewPost')) + '</button>';
      html += '<a class="btn-secondary" href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(openLabel(r)) + ' ↗</a>';
    }
    html += '</div><div style="display:flex; gap:8px; margin-left:auto;">';
    html += '<button class="btn-secondary" id="detailEdit">✎ ' + esc(t('edit')) + '</button>';
    html += '<button class="btn-primary" id="detailClose">' + esc(t('close')) + '</button>';
    html += '</div></div>';

    var modal = document.getElementById('detailModal');
    modal.innerHTML = html;

    modal.querySelectorAll('.seg button').forEach(function(b){
      b.addEventListener('click', function(){ detailView = b.getAttribute('data-view'); renderDetail(); });
    });
    document.getElementById('detailLike').addEventListener('click', function(e){ toggleLike(r.id, e.currentTarget); });
    var sb = document.getElementById('servingsBar');
    if(sb) sb.addEventListener('click', onServingsClick);
    document.getElementById('detailClose').addEventListener('click', closeDetail);
    document.getElementById('detailEdit').addEventListener('click', function(){ closeDetail(); openModal(r); });
    var eb = document.getElementById('detailEmbedBtn');
    if(eb) eb.addEventListener('click', function(){
      var wrap = document.getElementById('detailEmbed');
      var show = wrap.classList.contains('hidden');
      wrap.innerHTML = show ? embedHtml(r.link) : '';
      wrap.classList.toggle('hidden', !show);
      eb.textContent = '▶ ' + t(show ? 'hidePost' : 'previewPost');
    });
    var tb = document.getElementById('detailTranslate');
    if(tb) tb.addEventListener('click', async function(){
      var target = detailView;
      var srcLang = sourceLang(function(l){ return !!r['text' + cap(l)]; }, target, r.origLang);
      var src = srcLang ? r['text' + cap(srcLang)] : r.caption;
      if(!srcLang) srcLang = r.origLang || guessLang(r.caption || '');
      if(LANGS.indexOf(srcLang) === -1) srcLang = 'auto';
      var fields = {};
      if(srcLang === target){ fields['text' + cap(target)] = src; }
      else {
        tb.disabled = true; tb.textContent = t('translating');
        var out = await translate(src, srcLang, target);
        if(out == null){ tb.disabled = false; tb.textContent = '⇄ ' + t('translateNow'); return; }
        fields['text' + cap(target)] = out;
        fields.machine = Object.assign({}, r.machine);
        fields.machine[target] = true;
      }
      var titleSrc = sourceLang(function(l){ return !!r['title' + cap(l)]; }, target, srcLang);
      if(!r['title' + cap(target)] && titleSrc){
        var title = await translate(r['title' + cap(titleSrc)], titleSrc, target);
        if(title) fields['title' + cap(target)] = title;
      }
      if(!await saveRecipe(r, fields)) return;
      showToast(t('toastTranslated'));
      if(detailId === r.id) renderDetail();
      renderGrid();
    });
  }

  /* ---------- likes, delete ---------- */

  async function toggleLike(id, btnEl){
    var r = getRecipe(id);
    if(!r) return;
    if(!await saveRecipe(r, { liked:!r.liked })) return;
    if(btnEl){
      btnEl.classList.toggle('liked', r.liked);
      btnEl.textContent = r.liked ? '♥' : '♡';
      btnEl.classList.add('pop');
      setTimeout(function(){ btnEl.classList.remove('pop'); }, 300);
    }
    renderGrid();
    showToast(r.liked ? t('toastLiked') : t('toastUnliked'));
  }

  async function removeRecipe(id){
    try{
      await api('DELETE', '/api/recipes/' + encodeURIComponent(id));
    }catch(e){
      showToast(t('saveFailed') + ' ' + e.message);
      return;
    }
    state.recipes = state.recipes.filter(function(x){ return x.id !== id; });
    renderAll();
    showToast(t('toastDeleted'));
  }

  /* ---------- add / edit form ---------- */

  function setFormEmbed(show){
    var wrap = document.getElementById('formEmbed');
    var link = document.getElementById('fLink').value.trim();
    if(show && igCode(link)){
      wrap.innerHTML = embedHtml(link);
      wrap.classList.remove('hidden');
    } else {
      wrap.innerHTML = '';
      wrap.classList.add('hidden');
    }
    document.getElementById('previewPostBtn').textContent = '▶ ' + t(show && igCode(link) ? 'hidePost' : 'previewPost');
  }

  function openModal(existing){
    state.editingId = existing ? existing.id : null;
    document.getElementById('modalTitle').textContent = existing ? t('editRecipe') : t('addRecipe');
    var f = function(id, v){ document.getElementById(id).value = v || ''; };
    ['title', 'note', 'text'].forEach(function(field){
      LANGS.forEach(function(l){ f('f' + cap(field) + cap(l), existing && existing[field + cap(l)]); });
    });
    f('fLink', existing && existing.link);
    f('fCaption', existing && existing.caption);
    f('fTags', existing && (existing.tags||[]).map(tagLabel).join(', '));
    f('fServings', existing && existing.servings);
    document.getElementById('fServings').placeholder = (existing && statedServings(existing)) || '';
    formMachine = {};
    var cat = existing && existing.category !== 'inbox' ? existing.category : (state.activeCategory !== 'inbox' ? state.activeCategory : 'dinner');
    document.getElementById('fCategory').value = cat;
    document.getElementById('fFormula').checked = existing ? !!existing.formula : false;
    document.getElementById('deleteBtn').classList.toggle('hidden', !existing);
    setFormEmbed(false);
    document.getElementById('modalOverlay').classList.remove('hidden');
    document.getElementById(existing ? 'fTitle' + cap(state.lang) : 'fLink').focus();
  }

  function closeModal(){
    setFormEmbed(false);
    document.getElementById('modalOverlay').classList.add('hidden');
    state.editingId = null;
  }

  function parseTags(s){
    var byLabel = {};
    Object.keys(TAGS).forEach(function(k){
      byLabel[k] = k;
      LANGS.forEach(function(l){ byLabel[TAGS[k][l].toLocaleLowerCase('tr')] = k; });
    });
    return s.split(',').map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){
      return byLabel[x.toLocaleLowerCase('tr')] || x;
    });
  }

  async function fillByTranslation(btn, srcId, srcLang, dstId, dstLang){
    var src = document.getElementById(srcId).value.trim();
    if(!src) return;
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = t('translating');
    var out = await translate(src, srcLang, dstLang);
    btn.disabled = false; btn.textContent = label;
    if(out != null){
      document.getElementById(dstId).value = out;
      formMachine[dstLang] = true;
    }
  }
  var formMachine = {};

  // Fill one language's recipe text by translating the best other text in the form (or the caption).
  function fillField(btn){
    var target = btn.getAttribute('data-lang');
    var val = function(id){ return document.getElementById(id).value.trim(); };
    var r = state.editingId ? getRecipe(state.editingId) : null;
    var capText = val('fCaption');
    var orig = (r && r.origLang) || (capText ? guessLang(capText) : null);
    var src = sourceLang(function(l){ return !!val('fText' + cap(l)); }, target, orig);
    if(src) return fillByTranslation(btn, 'fText' + cap(src), src, 'fText' + cap(target), target);
    if(capText) return fillByTranslation(btn, 'fCaption', LANGS.indexOf(orig) !== -1 ? orig : 'auto', 'fText' + cap(target), target);
  }

  async function captionToAll(){
    var capText = document.getElementById('fCaption').value.trim();
    if(!capText) return;
    var lang = guessLang(capText);
    var btn = document.getElementById('captionToBothBtn');
    if(LANGS.indexOf(lang) !== -1 && !document.getElementById('fText' + cap(lang)).value.trim()){
      document.getElementById('fText' + cap(lang)).value = capText;
    }
    for(var i = 0; i < LANGS.length; i++){
      var l = LANGS[i];
      if(l !== lang && !document.getElementById('fText' + cap(l)).value.trim()){
        await fillByTranslation(btn, 'fCaption', lang, 'fText' + cap(l), l);
      }
    }
  }

  async function handleSubmit(e){
    e.preventDefault();
    var v = function(id){ return document.getElementById(id).value.trim(); };
    var data = {
      category:document.getElementById('fCategory').value,
      link:v('fLink'),
      caption:v('fCaption'),
      tags:parseTags(document.getElementById('fTags').value),
      formula:document.getElementById('fFormula').checked,
      servings:parseInt(v('fServings'), 10) || 0
    };
    ['title', 'note', 'text'].forEach(function(field){
      LANGS.forEach(function(l){ data[field + cap(l)] = v('f' + cap(field) + cap(l)); });
    });
    if(!LANGS.some(function(l){ return data['title' + cap(l)]; })){
      alert(t('validationTitle'));
      return;
    }
    var r = state.editingId ? getRecipe(state.editingId) : null;
    if(data.caption && !(r && r.origLang)) data.origLang = guessLang(data.caption);
    var machine = Object.assign({}, r && r.machine);
    LANGS.forEach(function(l){
      if(r && data['text' + cap(l)] !== (r['text' + cap(l)] || '')) delete machine[l];
    });
    Object.keys(formMachine).forEach(function(k){ machine[k] = true; });
    data.machine = machine;
    var saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    try{
      if(r){
        if(!await saveRecipe(r, data)) return;
      } else {
        var created = await api('POST', '/api/recipes', data);
        state.recipes.push(created.recipe);
      }
    }catch(err){
      showToast(t('saveFailed') + ' ' + err.message);
      return;
    }finally{
      saveBtn.disabled = false;
    }
    formMachine = {};
    closeModal();
    state.activeCategory = data.category;
    state.activeTag = null;
    renderAll();
    showToast(t('toastSaved'));
  }

  async function handleDelete(){
    if(state.editingId && confirm(t('deleteConfirm'))){
      var id = state.editingId;
      closeModal();
      await removeRecipe(id);
    }
  }

  /* ---------- meal ideas ---------- */

  function pickIdea(){
    var named = function(r){ return r.category !== 'inbox' && pick(r, 'title'); };
    var pool = state.recipes.filter(function(r){
      return named(r) && r.id !== currentIdeaId &&
        (state.activeCategory === 'inbox' || r.category === state.activeCategory) &&
        (!state.activeTag || (r.tags||[]).indexOf(state.activeTag) !== -1) &&
        (!state.likedOnly || r.liked) &&
        (!state.textOnly || hasRecipeText(r));
    });
    if(pool.length === 0) pool = state.recipes.filter(function(r){ return named(r) && r.id !== currentIdeaId; });
    if(pool.length === 0) return null;
    // favourites come up three times as often
    var weighted = [];
    pool.forEach(function(r){ weighted.push(r); if(r.liked){ weighted.push(r, r); } });
    return weighted[Math.floor(Math.random()*weighted.length)];
  }

  function renderIdea(){
    var r = pickIdea();
    var slot = document.getElementById('ideaCalloutSlot');
    if(!r){ slot.innerHTML = ''; currentIdeaId = null; return; }
    currentIdeaId = r.id;
    var tt = titles(r);
    var note = pick(r, 'note');
    var html = '<div class="idea-callout">';
    html += '<div><p class="idea-label">' + esc(t('ideaLabel')) + ' · ' + esc(catLabel(r.category)) + (r.liked ? ' · ♥' : '') + '</p>';
    html += '<p class="idea-title">' + esc(tt.primary) + (tt.secondary?'<span class="en">'+esc(tt.secondary)+'</span>':'') + '</p>';
    if(note) html += '<p class="idea-note">' + esc(note) + '</p>';
    html += '</div><div class="idea-callout-actions">';
    html += '<button id="ideaShowBtn">📄 ' + esc(t('ideaShow')) + '</button>';
    html += '<button id="ideaAgainBtn">🎲 ' + esc(t('ideaAgain')) + '</button>';
    html += '<button id="ideaCloseBtn">' + esc(t('ideaDismiss')) + '</button>';
    html += '</div></div>';
    slot.innerHTML = html;
    document.getElementById('ideaShowBtn').addEventListener('click', function(){ openDetail(r.id); });
    document.getElementById('ideaAgainBtn').addEventListener('click', renderIdea);
    document.getElementById('ideaCloseBtn').addEventListener('click', function(){
      slot.innerHTML = ''; currentIdeaId = null;
    });
  }

  /* ---------- import from a link ---------- */

  var importBusy = false;

  function setImportStatus(msg, isError){
    var el = document.getElementById('importStatus');
    el.textContent = msg || '';
    el.classList.toggle('hidden', !msg);
    el.classList.toggle('error', !!isError);
  }

  function showPasteBox(show){
    document.getElementById('pasteForm').classList.toggle('hidden', !show);
    document.getElementById('pasteToggle').classList.toggle('hidden', show);
  }

  // body is {url} for a link, or {url, text} for recipe text pasted from a site that blocks us.
  async function runImport(body, btn, label){
    if(importBusy) return;
    importBusy = true;
    btn.disabled = true;
    btn.textContent = t('importing');
    setImportStatus(t('importWorking'));
    try{
      var data = await api('POST', '/api/import', body);
      var r = data.recipe, known = getRecipe(r.id);
      if(known) Object.assign(known, r); else state.recipes.push(r);
      document.getElementById('importInput').value = '';
      document.getElementById('pasteText').value = '';
      showPasteBox(false);
      setImportStatus(data.duplicate ? t('importDuplicate') : (r.category === 'inbox' ? t('importInbox') : t('importDone')));
      state.activeCategory = r.category;
      state.activeTag = null;
      renderAll();
      openDetail(r.id);
    }catch(err){
      setImportStatus(err.message, true);
      if(!body.text) showPasteBox(true);  // whatever went wrong, the text itself still gets the recipe in
    }finally{
      importBusy = false;
      btn.disabled = false;
      btn.textContent = '+ ' + t(label);
    }
  }

  function importLink(e){
    e.preventDefault();
    var url = document.getElementById('importInput').value.trim();
    if(url) runImport({ url:url }, document.getElementById('importSubmit'), 'importBtn');
  }

  function importText(e){
    e.preventDefault();
    var text = document.getElementById('pasteText').value.trim();
    var url = document.getElementById('importInput').value.trim();
    if(text) runImport({ url:url, text:text }, document.getElementById('pasteSubmit'), 'pasteBtn');
  }

  /* ---------- wiring ---------- */

  function wireStaticEvents(){
    document.getElementById('themeToggle').addEventListener('click', function(){
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      saveTheme(next);
      applyTheme(next);
    });
    if(window.matchMedia){
      var darkQuery = matchMedia('(prefers-color-scheme: dark)');
      var onDeviceChange = function(e){ if(!hasSavedTheme()) applyTheme(e.matches ? 'dark' : 'light'); };
      if(darkQuery.addEventListener) darkQuery.addEventListener('change', onDeviceChange);
      else if(darkQuery.addListener) darkQuery.addListener(onDeviceChange);
    }
    document.querySelectorAll('#langToggle button').forEach(function(b){
      b.addEventListener('click', function(){
        if(state.lang === b.getAttribute('data-lang')) return;
        state.lang = b.getAttribute('data-lang');
        saveLang();
        renderAll();
        if(currentIdeaId) renderIdea();
        if(detailId){ detailView = state.lang; renderDetail(); }
      });
    });
    document.getElementById('likedOnly').addEventListener('change', function(e){
      state.likedOnly = e.target.checked;
      renderGrid();
    });
    document.getElementById('textOnly').addEventListener('change', function(e){
      state.textOnly = e.target.checked;
      renderGrid();
    });
    document.getElementById('searchInput').addEventListener('input', function(e){
      state.search = e.target.value;
      renderGrid();
    });
    document.getElementById('ideaBtn').addEventListener('click', renderIdea);
    document.getElementById('addBtn').addEventListener('click', function(){ openModal(null); });
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('recipeForm').addEventListener('submit', handleSubmit);
    document.getElementById('deleteBtn').addEventListener('click', handleDelete);
    document.getElementById('previewPostBtn').addEventListener('click', function(){
      setFormEmbed(document.getElementById('formEmbed').classList.contains('hidden'));
    });
    document.getElementById('captionToBothBtn').addEventListener('click', captionToAll);
    document.querySelectorAll('.fill-btn').forEach(function(b){
      b.addEventListener('click', function(){ fillField(b); });
    });
    document.getElementById('importForm').addEventListener('submit', importLink);
    document.getElementById('pasteForm').addEventListener('submit', importText);
    document.getElementById('pasteToggle').addEventListener('click', function(){
      showPasteBox(true);
      document.getElementById('pasteText').focus();
    });
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if(e.target === e.currentTarget) closeModal();
    });
    document.getElementById('detailOverlay').addEventListener('click', function(e){
      if(e.target === e.currentTarget) closeDetail();
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ closeModal(); closeDetail(); }
    });
  }

  // Android's share sheet opens /?title=…&text=…&url=… (share_target in the manifest).
  // Apps put the link in different fields (Instagram uses text), so take the first link anywhere.
  // Only fill the form: any site can link here with these parameters, so importing waits for a tap.
  function handleShare(){
    var q = new URLSearchParams(location.search);
    if(!q.has('url') && !q.has('text') && !q.has('title')) return;
    history.replaceState(null, '', location.pathname);  // a reload must not import again
    var shared = [q.get('url'), q.get('text'), q.get('title')].join(' ');
    var link = (shared.match(/https?:\/\/[^\s"'<>]+/) || [])[0];
    if(link){
      document.getElementById('importInput').value = link;
      document.getElementById('importSubmit').focus();
    }else if((q.get('text') || '').trim()){
      document.getElementById('pasteText').value = q.get('text').trim();
      showPasteBox(true);
    }
  }

  async function init(){
    state.lang = loadLang() || 'tr';
    if(!I18N[state.lang]) state.lang = 'tr';
    saveLang();
    document.getElementById('grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>Ocak yanıyor · De pan staat op het vuur · Heating the pan…</p></div>';
    wireStaticEvents();
    try{
      await loadData();
    }catch(e){
      document.getElementById('grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>Sunucuya ulaşılamadı / Could not reach the server / Server niet bereikbaar: ' + esc(e.message) + '</p></div>';
      renderChrome();
      return;
    }
    renderAll();
    if(state.offline) showToast(t('offline'), 6000);
    else handleShare();
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }

  init();
})();
</script>
</body>
</html>
